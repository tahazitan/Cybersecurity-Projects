name: Lab Code Validation
on: [push, pull_request]
jobs:
  python-offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests and parse sensor configuration XML
        run: python -m unittest discover -s tests -v
      - name: Verify synthetic fixture and JSON output
        run: python src/detect_events.py tests/fixtures/synthetic_sysmon.jsonl
